<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Same guard. Different assurance.</title><desc id="desc">Proposed experiment, no results: compare neutral and safety descriptions with identical coverage facts, replay effects and useful completion, then test a separate repair.</desc><rect width="1200" height="520" fill="#f2f0e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="25" dominant-baseline="text-before-edge" fill="#52635b" font-size="14" font-weight="700">MURDERBENCH / PROPOSED EXPERIMENT</text><text x="36" y="57" dominant-baseline="text-before-edge" fill="#243d36" font-size="37" font-weight="400">Same guard. Different assurance.</text><text x="36" y="110" dominant-baseline="text-before-edge" fill="#52635b" font-size="20" font-weight="400">Fixed task, observations, tools, motion limits and model settings</text><rect x="36" y="156" width="548" height="169" fill="#e7e9df" stroke="#243d36" stroke-width="2"/><text x="60" y="176" dominant-baseline="text-before-edge" fill="#52635b" font-size="14" font-weight="700">A / NEUTRAL DESCRIPTION</text><text x="60" y="208" dominant-baseline="text-before-edge" fill="#243d36" font-size="29" font-weight="400">“Motion validator”</text><text x="60" y="259" dominant-baseline="text-before-edge" fill="#52635b" font-size="20" font-weight="400">Same coverage: action bounds + step limits</text><rect x="616" y="156" width="548" height="169" fill="#e7e9df" stroke="#243d36" stroke-width="2"/><text x="640" y="176" dominant-baseline="text-before-edge" fill="#a83c22" font-size="14" font-weight="700">B / SAFETY DESCRIPTION</text><text x="640" y="208" dominant-baseline="text-before-edge" fill="#243d36" font-size="29" font-weight="400">“Safety approver”</text><text x="640" y="259" dominant-baseline="text-before-edge" fill="#52635b" font-size="20" font-weight="400">Same coverage: action bounds + step limits</text><path d="M310,326 L310,352" stroke="#243d36" stroke-width="2" fill="none"/><path d="M890,326 L890,352" stroke="#243d36" stroke-width="2" fill="none"/><path d="M310,352 L890,352" stroke="#243d36" stroke-width="2" fill="none"/><path d="M600,352 L600,372" stroke="#243d36" stroke-width="2" fill="none"/><text x="220" y="383" dominant-baseline="text-before-edge" fill="#243d36" font-size="27" font-weight="700">Replay unsafe effects + useful task completion</text><text x="36" y="442" dominant-baseline="text-before-edge" fill="#52635b" font-size="20" font-weight="400">Separate repair: explicit uncovered hazards + assigned responsibility</text><text x="36" y="481" dominant-baseline="text-before-edge" fill="#a83c22" font-size="16" font-weight="400">Study design only. No model trials or measured effect yet.</text></g></svg>